spring:
  application:
    name: termsheet-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/termsheet}
    username: ${SPRING_DATASOURCE_USERNAME:termsheet}
    password: ${SPRING_DATASOURCE_PASSWORD:termsheet}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

termsheet:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-real-32-byte-secret-in-prod-environments}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
    issuer: termsheet-api
  cookie:
    name: ${REFRESH_COOKIE_NAME:refresh_token}
    path: ${REFRESH_COOKIE_PATH:/api/auth}
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAMESITE:Lax}
    domain: ${COOKIE_DOMAIN:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    root: INFO
    com.termsheet.api: DEBUG
